# Local PostgreSQL matching the default DATABASE_URL in src/football_pipeline/config.py
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: football
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
